[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurobank"
version = "1.0.0.dev0"
description = "Simple data management system for neuroscience"
readme = "README.rst"
license = {text = "GNU General Public License v2"}
authors = [
    {name = "Dan Meliza", email = "dan@meliza.org"},
]
maintainers = [
    {name = "Dan Meliza", email = "dan@meliza.org"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: English",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "respx>=0.20",
    "ruff>=0.7.0"
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=4",
    "sphinx>=8",
    "sphinx-argparse>=0.5",
]
integration = [
    "django-neurobank>=0.12.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.urls]
Homepage = "https://github.com/melizalab/neurobank"

[project.scripts]
nbank = "nbank.script:main"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v -m 'not integration'"
testpaths = ["test"]
markers = [
    "integration: tests that run against a live registry (deselected by default)",
    "posix: tests that need a POSIX host (skipped on Windows)",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["attic"]

[tool.ruff.lint]
extend-select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "B",   # flake8-bugbear
  "I",   # isort
  "PGH", # pygrep-hooks
  "RUF", # Ruff-specific
  "UP",  # pyupgrade
]
ignore = ["E221", "E501", "E701"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ty.environment]
# nbank runs on Windows clients too, so platform checks shouldn't be narrowed
python-platform = "all"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true

[tool.hatch.build]
include = ["nbank/**"]
exclude = ["*test*"]

