# Read the Docs configuration: builds docs/ with the docs dependency group, for
# tagged releases only (exit code 183 cancels a build). CI builds the docs on
# every push and pull request, so broken docs fail there first.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      - if [ "$READTHEDOCS_VERSION_TYPE" != "tag" ]; then exit 183; fi
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
