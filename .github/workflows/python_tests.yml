# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python tests
on:
  pull_request:
  push:
    branches:
      - master
      - "maint/**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15-intel, macos-latest, ubuntu-26.04]
        python-version: ["3.11", "3.14", "pypy3.11"]
        # Windows is a client only: tests that need a POSIX host skip themselves
        include:
          - platform: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.platform }}
    # the suite takes seconds; fail a hung test rather than wait GitHub's 6 hours
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --all-extras --dev
    - name: Run tests
      run: uv run pytest

  docs:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Build the docs, failing on warnings as Read the Docs does
      run: uv run --frozen --group docs sphinx-build -W docs docs/_build/html
